apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           ports:
             - containerPort: PORT_CONTAINER

           env:
             - name: DATEBASE_URL
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: DATEBASE_URL
             - name: NODE_ENV
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: NODE_ENV
             - name: FILES_SERVICE_HOST
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: FILES_SERVICE_HOST
             - name: FILES_SERVICE_PORT
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: FILES_SERVICE_PORT
             - name: PORT_CORE
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: PORT_CORE
             - name: EMAIL_USER
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: EMAIL_USER
             - name: EMAIL_PASSWORD
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: EMAIL_PASSWORD
             - name: SITE_NAME
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: SITE_NAME
             - name: DOMAIN_ROOT
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: DOMAIN_ROOT
             - name: ENABLE_EMAIL_SENDING
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: ENABLE_EMAIL_SENDING
             - name: JWT_ACCESS_SECRET
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: JWT_ACCESS_SECRET
             - name: JWT_REFRESH_SECRET
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: JWT_REFRESH_SECRET
             - name: DATABASE_URL_CORE
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: DATABASE_URL_CORE
             - name: AUTH_APP_URL
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-coreapp-production-config-secret
                   key: AUTH_APP_URL