apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           ports:
             - containerPort: PORT_CONTAINER

           env:
             - name: NEW_RELIC_APP_NAME
               valueFrom:
                 secretKeyRef:
                   name: log-service-smart-group-production-config-secret
                   key: NEW_RELIC_APP_NAME
             - name: NEW_RELIC_LICENSE_KEY
               valueFrom:
                 secretKeyRef:
                   name: log-service-smart-group-production-config-secret
                   key: NEW_RELIC_LICENSE_KEY
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: log-service-smart-group-production-config-secret
                   key: RABBITMQ_URL
