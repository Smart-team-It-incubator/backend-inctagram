apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           ports:
             - containerPort: PORT_CONTAINER

           env:
             - name: JWT_REFRESH_SECRET
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: JWT_REFRESH_SECRET
             - name: CORE_APP_URL
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: CORE_APP_URL
             - name: AUTH_APP_URL
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: AUTH_APP_URL
             - name: PORT_AUTH
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: PORT_AUTH
             - name: PORT_CORE
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: PORT_CORE
             - name: EMAIL_USER
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: EMAIL_USER
             - name: EMAIL_PASSWORD
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: EMAIL_PASSWORD
             - name: SITE_NAME
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: SITE_NAME
             - name: DOMAIN_ROOT
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: DOMAIN_ROOT
             - name: ENABLE_EMAIL_SENDING
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: ENABLE_EMAIL_SENDING
             - name: DATABASE_URL_AUTH
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: DATABASE_URL_AUTH
             - name: RECAPTCHA_SECRET_KEY
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: RECAPTCHA_SECRET_KEY
             - name: GITHUB_CLIENT_ID
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: GITHUB_CLIENT_ID
             - name: GITHUB_CLIENT_SECRET
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: GITHUB_CLIENT_SECRET
             - name: GITHUB_CALLBACK_URL
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: GITHUB_CALLBACK_URL
             - name: HTTP_ONLY
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: HTTP_ONLY
             - name: BOT_TOKEN
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: BOT_TOKEN
             - name: NODE_ENV
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: NODE_ENV
             - name: JWT_ACCESS_SECRET
               valueFrom:
                 secretKeyRef:
                   name: smart-team-backend-auth-production-config-secret
                   key: JWT_ACCESS_SECRET
